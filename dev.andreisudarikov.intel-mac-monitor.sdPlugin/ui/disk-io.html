<!doctype html>
<html lang="en">
    <head>
        <title>Disk I/O</title>
        <meta charset="utf-8" />
        <script src="sdpi-components.js"></script>
    </head>
    <body>
        <sdpi-item>
            <sdpi-message>Combined read + write throughput across every drive (bytes per second). Spikes when disks are active. Tap to switch between graph and slide views; long-press for VU meter.</sdpi-message>
        </sdpi-item>
        <sdpi-item label="Sample window">
            <sdpi-select setting="sampleScope" default="global">
                <option value="global">Plugin default (all keys)</option>
                <option value="tile">This key only</option>
            </sdpi-select>
        </sdpi-item>
        <sdpi-item label="Samples" id="sd-sample-count-tile" hidden>
            <sdpi-range setting="sampleCount" min="15" max="60" step="5" default="30" showlabels></sdpi-range>
        </sdpi-item>
        <script>
            (function () {
                let lastScope = null;
                function tick() {
                    const dd = document.querySelector('sdpi-select[setting="sampleScope"]');
                    if (!dd) return;
                    const scope = dd.value;
                    if (scope === lastScope) return;
                    lastScope = scope;
                    const isTile = scope === "tile";
                    const t = document.getElementById("sd-sample-count-tile");
                    if (t) t.hidden = !isTile;
                }
                setInterval(tick, 200);
                tick();
            })();
        </script>
    </body>
</html>
