<!doctype html>
<html lang="en">
    <head>
        <title>Wi-Fi Temperature</title>
        <meta charset="utf-8" />
        <script src="sdpi-components.js"></script>
    </head>
    <body>
        <sdpi-item label="Units">
            <sdpi-select setting="tempUnit" default="C">
                <option value="C">Celsius</option>
                <option value="F">Fahrenheit</option>
            </sdpi-select>
        </sdpi-item>
        <sdpi-item label="Sample window">
            <sdpi-select setting="sampleScope" default="global">
                <option value="global">Plugin default (all keys)</option>
                <option value="tile">This key only</option>
            </sdpi-select>
        </sdpi-item>
        <sdpi-item label="Samples" id="sd-sample-count-tile" hidden>
            <sdpi-range setting="sampleCount" min="15" max="60" step="5" default="30" showlabels></sdpi-range>
        </sdpi-item>
        <script>
            // Show the per-tile slider only when scope = "This key only".
            // Polling instead of event listeners because sdpi-components'
            // value-change events don't reliably fire when switching back
            // to the default option.
            (function () {
                let lastScope = null;
                function tick() {
                    const dd = document.querySelector('sdpi-select[setting="sampleScope"]');
                    if (!dd) return;
                    const scope = dd.value;
                    if (scope === lastScope) return;
                    lastScope = scope;
                    const isTile = scope === "tile";
                    const t = document.getElementById("sd-sample-count-tile");
                    if (t) t.hidden = !isTile;
                }
                setInterval(tick, 200);   // 5 × / sec is plenty
                tick();
            })();
        </script>
    </body>
</html>
